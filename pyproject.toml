[project]
name = "lncrawl-mcp"
version = "0.1.0"
description = "MCP server for Lightnovel Crawler: search sources, download novels, read chapters, export e-books"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "mcp>=1.0.0,<2",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-asyncio>=0.21"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
lncrawl-mcp = "lncrawl_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lncrawl_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
